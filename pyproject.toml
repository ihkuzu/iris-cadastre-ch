[project]
name = "iris-cadastre-ch"
version = "0.1.0"
description = "Ingest Swiss official cadastral survey (AV) parcel geometries into a PostGIS staging schema"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
iris-cadastre-ch = "app.runners.cli:run"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:'crs' was not provided:UserWarning"]
