name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iris" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      IRIS_TEST_DATABASE_URL: postgresql+psycopg://iris:iris@localhost:5432/iris_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: migration
        run: IRIS_DATABASE_URL=$IRIS_TEST_DATABASE_URL alembic upgrade head

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p results && echo "IRIS_UID=$(id -u)" >> .env && echo "IRIS_GID=$(id -g)" >> .env
      - run: docker compose build
      - run: docker compose up -d db
      - run: docker compose run --rm app init-db
      - run: docker compose run --rm app inspect tests/data/synthetic_geodienste.gpkg
      - name: ingest synthetic data twice into a test schema, then report and validate
        env:
          RUN: docker compose run --rm -e IRIS_DB_SCHEMA=iris_staging_ci -e IRIS_SOURCES_FILE=tests/data/ci_sources.toml app
        run: |
          $RUN ingest XX --file tests/data/synthetic_geodienste.gpkg
          $RUN ingest XX --file tests/data/synthetic_geodienste.gpkg | tee second.txt
          grep -q "inserted 0, updated 0, unchanged 5" second.txt
          $RUN report --no-notes --out results/ci_report.md --results results/ci
          $RUN validate
          sed 's/iris_staging\./iris_staging_ci./g' sql/examples.sql | docker compose exec -T db psql -v ON_ERROR_STOP=1 -U iris -d iris_staging > /dev/null
      - name: report with the default paths, overwriting the tracked report as the runner user
        run: docker compose run --rm app report
      - name: validate must fail on the empty main staging table
        run: "! docker compose run --rm app validate"
      - run: docker compose down -v
